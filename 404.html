    <title>Aura – AI Website Builder</title>

    <!-- GitHub Pages routing fix: redirect root / to /code to avoid
         "No slug provided" crash when the SPA treats the github.io
         username subdomain as a published-site slug. -->
    <script>
      (function () {
        if (typeof window === "undefined") return;
        var host = (window.location.hostname || "").toLowerCase();
        var path = window.location.pathname || "/";
        if (
          host.endsWith(".github.io") &&
          !window.__CUSTOM_DOMAIN__ &&
          (path === "/" || path === "")
        ) {
          window.location.replace("/code");
        }
      })();
    </script>
